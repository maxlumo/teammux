[package]
name = "tmux-mobile"
version = "1.0.0"
edition = "2021"
license = "MIT"
default-run = "tmux-mobile"
# Both binaries are declared explicitly below. Disabling auto-discovery keeps
# macOS AppleDouble files such as `src/bin/._server.rs` from becoming phantom
# bundle targets on filesystems that generate resource-fork sidecars.
autobins = false

[lib]
name = "tmux_mobile"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tmux-mobile"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "tmm"
path = "src/bin/tmm.rs"

[features]
default = ["gui"]
# `embed-ui` builds the web UI (`dist/`, from `npm run build`) INTO the binary,
# so `tmm gateway` serves it on its own port with no files beside it (board
# #323). build.rs fails clearly when dist/index.html is missing. Off by
# default: the desktop app has its own webview and needs no copy.
embed-ui = []
# `gui` carries the Tauri shell: the window, the webview, and the three plugins
# the webview calls. ON by default, so `tauri dev`, `tauri build`, `build:mac`
# and `build:android` behave exactly as before.
#
# Off, the crate builds only what the WebSocket server and the `tmm` CLI need,
# with no webview in the dependency graph at all (`npm run build:server`). That
# is the supported build on any host without a WebKit webview — a Linux box with
# no WebKitGTK development package, a CI runner, a container — because on Linux
# `tauri` reaches gtk3 and webkit2gtk-4.1 through wry, so a `--bin server` build
# that needs none of it would otherwise fail in `glib-sys`'s build script.
#
# `tauri-build` stays a plain build-dependency: it is pure Rust, and build.rs
# needs it whenever `gui` is on.
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-opener", "dep:tauri-plugin-notification"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"
rustls-pemfile = "2"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
futures-util = "0.3"
# `tmm task stop` signals the task's PROCESS GROUP (killpg), not just the
# `sh -c` wrapper tmux runs — already in the graph through tokio/socket2.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = [], optional = true }
toml = "1.0.3"
# `tmm setup` edits config.toml in place, keeping its comments and every key
# it did not ask about (board #323). Already in the graph (through tauri).
toml_edit = "0.23"
base64 = "0.22"
dirs = "5"
gethostname = "0.4"
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
urlencoding = "2"
hex = "0.4"
flate2 = "1"
socket2 = "0.5"
tauri-plugin-notification = { version = "2", optional = true }

# `projects` (state.db) is desktop-only: the phone is a client of a desktop
# server, so it never needs SQLite compiled in.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# Server system vitals for board #56 (CPU / memory / root-disk shown in the
# desktop client). Pinned EXACT: the crate's reading APIs have a history of
# renames between minors (0.30 → 0.31 → 0.33 all moved methods), so a floating
# caret would compile-break on an unrelated `cargo update`. default-features
# off + only the `system` (CPU+memory) and `disk` features: no process table,
# no network counters, no multithread refresh — the poll is low-frequency and
# reads exactly three numbers. Chosen over hand-rolled /proc + mach readers
# because the macOS half (host_statistics64 / sysctl) is unsafe FFI that this
# Linux dev host can never execute, while sysinfo's implementations of both
# platforms are the ecosystem-standard, widely exercised ones. Desktop-gated:
# only the desktop server answers `system_status` (a phone is a client).
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk"] }
# Local wall-clock formatting for the lines we type into an agent's pane and for
# `tmm log`; desktop-gated because those two paths are.
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
# The gateway's launchd plist is read and written as a STRUCTURE (board #323),
# XML or binary, never by string splitting. Already in the graph via tauri.
plist = "1.8"

# `npm run tauri:dev:release` and `tauri build` use this profile.
#
# incremental was ON here to shorten edit-rebuild cycles, and it has been turned
# OFF because it stopped working on this crate: every release build after a
# source edit failed at link time with hundreds of
#   Undefined symbols: "_anon.<hash>.<n>.llvm.<n>", referenced from … libtmux_mobile.rlib
#   ld: symbol(s) not found for architecture arm64
# and only `cargo clean -p tmux-mobile --release` (a full ~2 min rebuild of this
# crate) recovered. That is the same cost as building non-incrementally, so
# incremental bought nothing and cost a confusing failure on every edit. The
# trigger is this crate's multi-crate-type output (staticlib + cdylib + rlib):
# LLVM's anonymous per-CGU symbols get renamed between incremental runs while
# the rlib still references the old names.
[profile.release]
incremental = false
