<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
  <title>Teammux</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2" />
  <!-- PWA: web app manifest + platform hints so the browser offers "install"
       (Chrome/Edge/Android fire `beforeinstallprompt`; iOS Safari uses these
       apple-* tags for "Add to Home Screen"). The in-app InstallPrompt
       component (browser-only) surfaces the offer; the service worker
       (registered in main.ts) satisfies installability. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Teammux" />
  <link rel="apple-touch-icon" href="/pwa-192.png" />
  <!--
    Font strategy: system monospace + bundled SYMBOL fonts only.

    We used to bundle Maple Mono (latin + 5 MB CJK subset) for cross-device
    identity, but the latin file was actually the Light (300) cut — normal
    text rendered thin everywhere except machines with the full font
    installed — and async webfont swap forced fragile xterm re-measure
    logic. xterm renders a fixed cell grid, so alignment never depended on
    the font anyway; every platform's native mono + CJK stack (SF Mono /
    Cascadia / Roboto Mono, PingFang / YaHei / Noto CJK / MiSans) is
    metric-safe and higher quality than a downloaded subset.

    What system fonts genuinely lack:
      - agent status markers etc. (⏺ ✳ ✻ …): noto-symbols2-subset
        (symbol/arrow/braille blocks, ~70 KB)
      - Nerd Font PUA icons (starship prompts etc.): symbols-nerd-mono
        (nothing ships these)
    Both are last in the stack: they only fill glyphs the system fonts
    miss. `display: swap` shows fallback for the few ms of decode.

    Users who prefer a specific mono font (e.g. Maple Mono NF CN) set it in
    Settings → terminal font; see the custom-font notes in
    docs/design-docs/features/fonts.md.
  -->
  <style>
    @font-face {
      font-family: 'Noto Sans Symbols 2'; font-style: normal; font-weight: 400;
      font-display: swap; src: url('/fonts/noto-symbols2-subset.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Symbols Nerd Font Mono'; font-style: normal; font-weight: 400;
      font-display: swap; src: url('/fonts/symbols-nerd-mono.woff2') format('woff2');
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
