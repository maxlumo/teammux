<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640">
  <defs>
    <style>
      .t{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif}
      .ti{font-size:20px;font-weight:700;fill:#0f172a}
      .sub{font-size:13px;fill:#64748b}
      .st{font-size:16px;font-weight:700;fill:#0f172a}
      .stx{font-size:11.5px;fill:#475569}
      .ed{font-size:12.5px;fill:#334155}
      .sm{font-size:11.5px;fill:#64748b}
    </style>
    <marker id="s_b" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker>
    <marker id="s_o" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#ea580c"/></marker>
    <marker id="s_g" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="640" fill="#ffffff"/>
  <text class="t ti" x="40" y="40">状态是怎么推导出来的：三个状态，各由哪条事实决定</text>
  <text class="t sub" x="40" y="64">projects/telemetry.rs · derive_from() · 「最新的那条回合边界」说话 · since 是客户端用来计时的起点</text>
  <circle cx="76" cy="306" r="8" fill="#0f172a"/>
  <text class="t sm" x="76" y="336" text-anchor="middle">新窗口</text>
  <rect x="146" y="254" width="186" height="104" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="t st" x="239.0" y="281" text-anchor="middle">idle 空闲</text>
  <text class="t stx" x="239.0" y="302" text-anchor="middle">没有回合在跑</text>
  <text class="t stx" x="239.0" y="317" text-anchor="middle">since = 回合结束时刻</text>
  <text class="t stx" x="239.0" y="332" text-anchor="middle">detail = done 的摘要</text>
  <rect x="452" y="118" width="206" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="t st" x="555.0" y="145" text-anchor="middle">running 进行中</text>
  <text class="t stx" x="555.0" y="166" text-anchor="middle">有一个回合开着</text>
  <text class="t stx" x="555.0" y="181" text-anchor="middle">since = 回合的开始</text>
  <text class="t stx" x="555.0" y="196" text-anchor="middle">detail = 最后一次工具调用</text>
  <rect x="452" y="412" width="206" height="104" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text class="t st" x="555.0" y="439" text-anchor="middle">waiting 等回复</text>
  <text class="t stx" x="555.0" y="460" text-anchor="middle">卡在人身上</text>
  <text class="t stx" x="555.0" y="475" text-anchor="middle">since = 提问时刻</text>
  <text class="t stx" x="555.0" y="490" text-anchor="middle">detail = 卡在什么上</text>
  <rect x="790" y="242" width="226" height="128" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text class="t st" x="903.0" y="269" text-anchor="middle">没有 failed 状态</text>
  <text class="t stx" x="903.0" y="290" text-anchor="middle">StopFailure 也只是回合结束：</text>
  <text class="t stx" x="903.0" y="305" text-anchor="middle">idle，detail = last_turn_failed</text>
  <text class="t stx" x="903.0" y="320" text-anchor="middle">（board #354：那个红点几乎</text>
  <text class="t stx" x="903.0" y="335" text-anchor="middle">都是网络超时，而 agent</text>
  <text class="t stx" x="903.0" y="350" text-anchor="middle">早就自己恢复了）</text>
  <path d="M 88,306 L 140,306" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#s_g)"/>
  <text class="t ed" x="0" y="-99" text-anchor="middle" fill="#64748b"></text>
  <path d="M 262,254 C 262,172 352,166 446,166" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s_b)"/>
  <text class="t ed" x="344" y="146" text-anchor="middle" fill="#2563eb">userPromptSubmit</text>
  <text class="t sm" x="344" y="161" text-anchor="middle">或者一次工具调用</text>
  <path d="M 492,222 C 452,276 372,268 334,292" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s_b)"/>
  <text class="t ed" x="400" y="272" text-anchor="middle" fill="#2563eb">stop，失败也算</text>
  <text class="t sm" x="400" y="287" text-anchor="middle">或 tmm done</text>
  <path d="M 586,222 L 586,406" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#s_o)"/>
  <text class="t ed" x="700" y="306" text-anchor="middle" fill="#ea580c">permission_required</text>
  <text class="t sm" x="700" y="321" text-anchor="middle">input_required · tmm status waiting</text>
  <path d="M 518,406 L 518,228" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s_b)"/>
  <text class="t ed" x="420" y="352" text-anchor="middle" fill="#2563eb">一次工具调用，或新的一轮</text>
  <path d="M 452,462 C 372,462 342,410 334,360" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s_b)"/>
  <text class="t ed" x="356" y="444" text-anchor="middle" fill="#2563eb">stop</text>
  <rect x="146" y="540" width="860" height="88" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6,4"/>
  <text class="t sm" x="162" y="560" style="font-weight:700;fill:#334155">兜底规则，而且只是兜底</text>
  <text class="t sm" x="162" y="578">这个窗口从来没有产生过任何 hook 事实（没有 hook 的后端、手工起的窗口）？</text>
  <text class="t sm" x="162" y="593">才轮到它：tmux window_activity 距今 &lt; 30 秒 → running，否则 idle。</text>
  <text class="t sm" x="162" y="608">它以前对每个窗口都生效，那就是那个 bug —— agent 的 TUI 回答完还在重绘提示符，</text>
  <text class="t sm" x="162" y="623">于是 pane 活动永远比 stop 更新，一个已经答完的 agent 会永远显示“working”。</text>
</svg>