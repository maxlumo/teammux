<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620">
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
      .ti{font-size:19px;font-weight:700;fill:#0f172a}
      .sub{font-size:12.5px;fill:#64748b}
      .st{font-size:15px;font-weight:700;fill:#0f172a}
      .stx{font-size:11px;fill:#475569}
      .ed{font-size:12px;fill:#334155}
      .sm{font-size:11px;fill:#64748b}
      .mono{font-family:ui-monospace,Menlo,monospace}
    </style>
    <marker id="s_b" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker>
    <marker id="s_o" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#ea580c"/></marker>
    <marker id="s_g" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1080" height="620" fill="#ffffff"/>
  <text class="t ti" x="40" y="40">Derived status: three states, and the fact that decides each</text>
  <text class="t sub" x="40" y="62">projects/telemetry.rs · derive_from() · the newest turn boundary wins · `since` is what a client counts from</text>
  <circle cx="80" cy="300" r="8" fill="#0f172a"/>
  <text class="t sm" x="80" y="330" text-anchor="middle">new window</text>
  <rect x="150" y="250" width="170" height="96" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="t st" x="235.0" y="276" text-anchor="middle">idle</text>
  <text class="t stx" x="235.0" y="295" text-anchor="middle">no turn open</text>
  <text class="t stx" x="235.0" y="309" text-anchor="middle">since = the turn end</text>
  <text class="t stx" x="235.0" y="323" text-anchor="middle">detail = done summary</text>
  <rect x="430" y="120" width="190" height="96" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="t st" x="525.0" y="146" text-anchor="middle">running</text>
  <text class="t stx" x="525.0" y="165" text-anchor="middle">a turn is open</text>
  <text class="t stx" x="525.0" y="179" text-anchor="middle">since = the turn START</text>
  <text class="t stx" x="525.0" y="193" text-anchor="middle">detail = last tool call</text>
  <rect x="430" y="400" width="190" height="96" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text class="t st" x="525.0" y="426" text-anchor="middle">waiting</text>
  <text class="t stx" x="525.0" y="445" text-anchor="middle">blocked on a human</text>
  <text class="t stx" x="525.0" y="459" text-anchor="middle">since = the ask</text>
  <text class="t stx" x="525.0" y="473" text-anchor="middle">detail = why</text>
  <rect x="740" y="238" width="230" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text class="t st" x="855.0" y="264" text-anchor="middle">no failed state</text>
  <text class="t stx" x="855.0" y="283" text-anchor="middle">a StopFailure end is an END:</text>
  <text class="t stx" x="855.0" y="297" text-anchor="middle">idle, detail = last_turn_failed</text>
  <text class="t stx" x="855.0" y="311" text-anchor="middle">(board #354 — the red dot was</text>
  <text class="t stx" x="855.0" y="325" text-anchor="middle">a timeout the agent had</text>
  <text class="t stx" x="855.0" y="339" text-anchor="middle">already recovered from)</text>
  <path d="M 92,300 L 144,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#s_g)"/>
  <text class="t ed" x="0" y="-99" text-anchor="middle" fill="#64748b"></text>
  <path d="M 260,250 C 260,170 340,168 424,168" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s_b)"/>
  <text class="t ed" x="330" y="150" text-anchor="middle" fill="#2563eb">userPromptSubmit</text>
  <text class="t sm mono" x="330" y="164" text-anchor="middle">or a tool call</text>
  <path d="M 470,216 C 430,270 360,262 322,286" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s_b)"/>
  <text class="t ed" x="386" y="268" text-anchor="middle" fill="#2563eb">stop, failed or not</text>
  <text class="t sm mono" x="386" y="282" text-anchor="middle">tmm done</text>
  <path d="M 560,216 L 560,394" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#s_o)"/>
  <text class="t ed" x="660" y="300" text-anchor="middle" fill="#ea580c">permission_required</text>
  <text class="t sm mono" x="660" y="314" text-anchor="middle">input_required · tmm status</text>
  <path d="M 496,394 L 496,222" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s_b)"/>
  <text class="t ed" x="400" y="340" text-anchor="middle" fill="#2563eb">a tool call, or a new prompt</text>
  <path d="M 430,448 C 360,448 330,400 322,352" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#s_b)"/>
  <text class="t ed" x="352" y="430" text-anchor="middle" fill="#2563eb">stop</text>
  <rect x="150" y="520" width="800" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6,4"/>
  <text class="t sm" x="166" y="540" style="font-weight:700;fill:#334155">fallback, and only as a fallback</text>
  <text class="t sm" x="166" y="556">No hook has EVER spoken for this window (a hookless backend, a window started by hand)?</text>
  <text class="t sm" x="166" y="570">Then and only then: tmux window_activity &lt; 30 s -> running, else idle.</text>
  <text class="t sm" x="166" y="584">It used to be a signal for every window, and that was the bug — an agent TUI repaints its</text>
  <text class="t sm" x="166" y="598">prompt after answering, so activity was always newer than the stop and a finished agent</text>
  <text class="t sm" x="166" y="612">read `working` forever.</text>
</svg>